<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Demolition - Complete Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a0a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 6px rgba(0, 255, 200, 0.8);
        }
        #instructionsOverlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 26, 0.75);
            backdrop-filter: blur(4px);
            color: #ffffff;
            cursor: pointer;
            z-index: 100;
            transition: opacity 0.2s ease;
        }
        .instruction-card {
            background: rgba(22, 24, 45, 0.95);
            border: 1px solid rgba(0, 255, 200, 0.4);
            border-radius: 12px;
            padding: 28px 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            pointer-events: auto;
        }
        .instruction-card h2 {
            margin: 0 0 12px 0;
            font-size: 26px;
            color: #00ffcc;
            letter-spacing: 1px;
        }
        .instruction-card p {
            margin: 8px 0;
            font-size: 14px;
            color: #c0c6e0;
        }
        .instruction-card .prompt {
            margin-top: 18px;
            display: inline-block;
            padding: 12px 28px;
            background: #00ffcc;
            color: #0a0a1a;
            font-weight: bold;
            border-radius: 6px;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }
        .instruction-card .prompt:hover {
            background: #33ffdd;
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.7);
        }
        .instruction-card .prompt:active {
            transform: scale(0.96);
        }
    </style>
    
    <!-- Import Maps allow fallback or direct browser ES6 module loading -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="instructionsOverlay">
        <div class="instruction-card">
            <h2>VOXEL DEMOLITION</h2>
            <p><strong>Click anywhere to engage controls</strong></p>
            <p><strong>WASD:</strong> Fly Forward / Left / Back / Right</p>
            <p><strong>Space / Shift:</strong> Ascend / Descend</p>
            <p><strong>Left Click:</strong> Fire Rocket</p>
            <p><strong>Mouse:</strong> Aim / Look around</p>
            <p><strong>ESC:</strong> Release mouse pointer</p>
            <button id="playBtn" class="prompt">CLICK TO PLAY</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Main JavaScript Logic Entry Point -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
